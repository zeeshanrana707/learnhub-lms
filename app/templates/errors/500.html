{% extends 'base.html' %}
{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="display-1 text-warning fw-bold"><i class="bi bi-exclamation-triangle"></i> 500</div>
  <h2 class="mt-3">Internal Server Error</h2>
  <p class="text-muted lead">An unexpected error occurred while processing your request. Our system team has been alerted.</p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary mt-3">
    <i class="bi bi-house-door me-1"></i> Return Home
  </a>
</div>
{% endblock %}
