{% extends 'base.html' %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="display-1 text-secondary fw-bold"><i class="bi bi-question-circle"></i> 404</div>
  <h2 class="mt-3">Page Not Found</h2>
  <p class="text-muted lead">The page, course, or resource you are looking for does not exist or has been relocated.</p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary mt-3">
    <i class="bi bi-house-door me-1"></i> Go to Homepage
  </a>
</div>
{% endblock %}
