{% extends 'base.html' %}
{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="display-1 text-danger fw-bold"><i class="bi bi-shield-x"></i> 403</div>
  <h2 class="mt-3">Access Forbidden</h2>
  <p class="text-muted lead">You do not have the required permissions or role to access this resource.</p>
  <a href="{{ url_for('catalog.index') }}" class="btn btn-primary mt-3">
    <i class="bi bi-arrow-left me-1"></i> Return to Catalog
  </a>
</div>
{% endblock %}
